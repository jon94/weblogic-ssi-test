# /etc/datadog-agent/conf.d/weblogic.d/conf.yaml
# Collects logs from:
#   - WebLogic server logs (startup, errors, deployments)
#   - WebLogic HTTP access logs
#   - Application Log4j2 file log (with trace-log correlation MDC placeholders)

logs:
  - type: file
    path: /opt/oracle/domains/base_domain/servers/AdminServer/logs/AdminServer.log
    service: petclinic
    source: weblogic
    env: demo
    tags:
      - server:AdminServer
      - version:1.0

  - type: file
    path: /opt/oracle/domains/base_domain/servers/AdminServer/logs/access.log
    service: petclinic
    source: weblogic
    sourcecategory: http_access
    env: demo
    tags:
      - server:AdminServer
      - version:1.0

  - type: file
    path: /opt/oracle/domains/base_domain/servers/ssi-demo-ms/logs/ssi-demo-ms.log
    service: petclinic
    source: weblogic
    env: demo
    tags:
      - server:ssi-demo-ms
      - version:1.0

  - type: file
    path: /opt/oracle/domains/base_domain/servers/ssi-demo-ms/logs/access.log
    service: petclinic
    source: weblogic
    sourcecategory: http_access
    env: demo
    tags:
      - server:ssi-demo-ms
      - version:1.0

  # Application log — contains dd.trace_id and dd.span_id from Log4j2 MDC
  # when DD_LOGS_INJECTION=true is set and an active trace span exists.
  # Note: trace_id/span_id are populated only when the Datadog agent has
  # instrumented the request path (Spring MVC, JAX-RS etc.). WebLogic JSPs
  # may require explicit span creation via the dd-trace-api.
  - type: file
    path: /opt/oracle/logs/petclinic-app.log
    service: petclinic
    source: java
    sourcecategory: app
    env: demo
    tags:
      - version:1.0
